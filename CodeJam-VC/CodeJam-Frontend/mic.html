<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceCal · Speak</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="voicecal.css">
  <script src="account.js" defer></script>
  <script src="mic.js" defer></script>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-google" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A11.9 11.9 0 0 1 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></symbol>
  </svg>

  <header class="nav">
    <a class="back-link" href="HomePage.html"><svg class="icon"><use href="#i-back"/></svg>Back</a>
    <div class="account" id="account"><span class="status-pill">Checking server…</span></div>
    <a class="app-chip" href="HomePage.html">
      <span class="brand-icon"><svg class="icon"><use href="#i-mic"/></svg></span>
      <span class="app-chip-label">VoiceCal</span>
    </a>
  </header>

  <main class="builder">
    <section class="capture" aria-labelledby="capture-title">
      <h1 id="capture-title">Tap to Speak</h1>
      <p class="capture-subtitle" id="subtitle">Press the microphone button to start recording</p>

      <div class="record-ring" id="recordRing">
        <button class="mic-button" id="recordBtn" type="button" data-state="idle" aria-label="Start recording">
          <svg class="icon icon-mic"><use href="#i-mic"/></svg>
          <svg class="icon icon-stop"><use href="#i-stop"/></svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </div>

      <div class="rec-meta">
        <span class="rec-dot" id="recDot" hidden></span>
        <span class="rec-timer" id="timer" hidden>0:00</span>
        <button class="btn btn-ghost btn-small" id="cancelBtn" type="button" hidden>Cancel</button>
      </div>
      <p class="hint" id="hint"><kbd>Space</kbd> to start or stop · <kbd>Esc</kbd> to cancel · up to 60 seconds</p>

      <div class="divider">or type it</div>
      <form class="type-form" id="typeForm">
        <label class="sr-only" for="textInput">Describe your events</label>
        <input id="textInput" type="text" maxlength="2000" autocomplete="off"
               placeholder="Lunch with Sam tomorrow at noon">
        <button class="btn btn-primary" type="submit" id="typeSubmit"><svg class="icon"><use href="#i-send"/></svg><span class="sr-only">Add to schedule</span></button>
      </form>

      <blockquote class="transcript" id="transcript" hidden><strong>You said</strong><span id="transcriptText"></span></blockquote>
      <div class="notices" id="notices" aria-live="polite"></div>
    </section>

    <section class="schedule" aria-labelledby="schedule-title">
      <div class="schedule-head">
        <h2 id="schedule-title">Your schedule <span class="count-badge" id="count">0</span></h2>
        <button class="btn btn-ghost btn-small" id="addManual" type="button"><svg class="icon"><use href="#i-plus"/></svg>Add event</button>
      </div>

      <div class="event-list" id="eventList"></div>
      <div class="empty-state" id="emptyState">
        <svg class="icon"><use href="#i-calendar"/></svg>
        <p>Events you say or type show up here so you can check them before they go to your calendar.</p>
      </div>

      <div class="schedule-foot">
        <button class="btn btn-ghost" id="clearBtn" type="button">Clear</button>
        <button class="btn btn-primary" id="saveBtn" type="button" disabled>
          <svg class="icon"><use href="#i-calendar"/></svg><span id="saveLabel">Add to Google Calendar</span>
        </button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
